name: Build-musl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Test inside Alpine
        run: |
          docker run --rm -v $PWD:/src -w /src alpine:latest \
            sh -c "
              apk add --no-cache build-base openssl-dev &&
              make distclean || true &&
              make dist &&
              echo '--- Running test ---' &&
              make disttest
            "

      - name: Upload musl binary
        uses: actions/upload-artifact@v4
        with:
          name: xorcrypt-musl
          path: |
            xorcrypt
            xorcrypt-avx2